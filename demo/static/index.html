<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dududu 语音输入测试</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4; --panel: #fff; --line: #dddcd7; --text: #1c1c1a; --dim: #77766f;
    --accent: #1f6feb; --user: #e8f0fe; --agent: #f0efe9; --warn: #b45309; --ok: #15803d; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --line: #33332f; --text: #ecebe6; --dim: #8d8c85;
      --accent: #6ea8ff; --user: #1d2a44; --agent: #2a2a26; --warn: #f0a94a; --ok: #5fd08a; --err: #ff7b72;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, "PingFang SC", "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  h1 { font-size: 16px; margin: 0 8px 0 0; }
  button, select { font: inherit; color: inherit; background: var(--panel);
                   border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  select { max-width: 260px; }
  button#toggle { background: var(--accent); color: #fff; border-color: transparent; min-width: 72px; cursor: pointer; }
  label { display: inline-flex; align-items: center; gap: 4px; color: var(--dim); }
  #status { margin-left: auto; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
            font-variant-numeric: tabular-nums; }
  #status[data-s="user"] { color: var(--ok); border-color: var(--ok); }
  #status[data-s="agent"] { color: var(--accent); border-color: var(--accent); }
  #status[data-s="paused"] { color: var(--warn); border-color: var(--warn); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
            display: flex; flex-direction: column; min-width: 0; height: calc(100vh - 150px); min-height: 320px; }
  section h2 { font-size: 12px; font-weight: 600; color: var(--dim); margin: 0; padding: 8px 12px;
               border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .scroll { overflow-y: auto; padding: 12px; flex: 1; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { background: var(--user); margin-left: auto; }
  .msg.agent { background: var(--agent); }
  .msg.live { opacity: .6; font-style: italic; }
  .msg.cut::after { content: " (被打断)"; color: var(--warn); font-size: 12px; }
  .msg small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; font-style: normal; }
  #log { font: 12px/1.6 ui-monospace, Menlo, monospace; }
  #log div { display: grid; grid-template-columns: 62px 132px 1fr; gap: 6px; overflow-wrap: anywhere; }
  #log .t { color: var(--dim); }
  #log .SpeechStarted .n, #log .TurnRetracted .n { color: var(--ok); }
  #log .SpeculativeFinal .n { color: var(--warn); }
  #log .CommittedFinal .n { color: var(--accent); font-weight: 600; }
  #log .TurnDropped .n, #log .ctl .n { color: var(--dim); }
  #log .error .n { color: var(--err); }
  footer { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>dududu 语音输入测试</h1>
    <button id="toggle">开始</button>
    <select id="mic" title="麦克风"></select>
    <label><input type="checkbox" id="aec" checked>回声消除</label>
    <label><input type="checkbox" id="ns" checked>降噪</label>
    <span id="status" data-s="off">未连接</span>
  </header>
  <div class="cols">
    <section>
      <h2><span>对话</span><span id="latency"></span></h2>
      <div class="scroll" id="chat"></div>
    </section>
    <section>
      <h2><span>事件流</span><span>时间 = 音频时间</span></h2>
      <div class="scroll" id="log"></div>
    </section>
  </div>
  <footer>外放时请保持"回声消除"开启,否则 agent 的声音会被当成你在说话。建议使用 Chrome。</footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const chat = $("chat"), log = $("log"), statusEl = $("status");

// 麦克风采集: 在 AudioWorklet 里攒够 20ms 就转成 16-bit PCM 发给主线程
const WORKLET = `
class Capture extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Int16Array(320); this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      const s = Math.max(-1, Math.min(1, ch[i]));
      this.buf[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (this.n === 320) { this.port.postMessage(this.buf.slice().buffer); this.n = 0; }
    }
    return true;
  }
}
registerProcessor("capture", Capture);`;

let ws, micCtx, micStream, playCtx;
let running = false, nextPlayTime = 0, playing = false, paused = false, userSpeaking = false;
const sources = new Set();
let liveUser = null, liveAgent = null, lastAgent = null;  // lastAgent: 文字已出完但还在播放的那条回复

function setStatus() {
  const s = !running ? "off" : paused ? "paused" : userSpeaking ? "user" : playing ? "agent" : "idle";
  statusEl.dataset.s = s;
  statusEl.textContent = { off: "未连接", paused: "已暂停播放(疑似打断)", user: "你在说话", agent: "agent 在说话", idle: "聆听中" }[s];
}

function addLog(cls, time, name, text) {
  const row = document.createElement("div");
  row.className = cls;
  for (const [c, v] of [["t", time], ["n", name], ["x", text || ""]]) {
    const span = document.createElement("span");
    span.className = c; span.textContent = v; row.append(span);
  }
  log.append(row); log.scrollTop = log.scrollHeight;
}

function bubble(who) {
  const el = document.createElement("div");
  el.className = `msg ${who} live`;
  chat.append(el); chat.scrollTop = chat.scrollHeight;
  return el;
}

// ---- 播放 agent 的语音 (24kHz 16-bit PCM) ----
function reportPlaying(value) {
  if (playing === value) return;
  playing = value;
  if (ws?.readyState === 1) ws.send(JSON.stringify({ playing }));
  setStatus();
}

function playPcm(arrayBuffer) {
  const pcm = new Int16Array(arrayBuffer);
  const buffer = playCtx.createBuffer(1, pcm.length, 24000);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) data[i] = pcm[i] / 0x8000;
  const src = playCtx.createBufferSource();
  src.buffer = buffer; src.connect(playCtx.destination);
  nextPlayTime = Math.max(nextPlayTime, playCtx.currentTime + 0.05);
  src.start(nextPlayTime);
  nextPlayTime += buffer.duration;
  sources.add(src);
  src.onended = () => { sources.delete(src); if (!sources.size) { reportPlaying(false); if (!liveAgent) lastAgent = null; } };
  reportPlaying(true);
}

function clearPlayback() {
  for (const src of sources) { src.onended = null; src.stop(); }
  sources.clear(); nextPlayTime = 0;
  playCtx.resume();
  reportPlaying(false);
}

// ---- 处理后端消息 ----
function onMessage(msg) {
  if (msg.type === "event") {
    const t = (msg.audio_ms / 1000).toFixed(2) + "s";
    if (msg.name !== "InterimTranscript") addLog(msg.name, t, msg.name, msg.text);
    if (msg.name === "SpeechStarted") { userSpeaking = true; liveUser = bubble("user"); liveUser.textContent = "…"; }
    if (msg.name === "InterimTranscript" || msg.name === "SpeculativeFinal") liveUser.textContent = msg.text;
    if (msg.name === "CommittedFinal") { userSpeaking = false; liveUser.textContent = msg.text; liveUser.classList.remove("live"); }
    if (msg.name === "TurnDropped") { userSpeaking = false; liveUser.remove(); }
  } else if (msg.type === "reply_text") {
    if (!liveAgent) { liveAgent = lastAgent = bubble("agent"); liveAgent.classList.remove("live"); }
    liveAgent.textContent += msg.text;
  } else if (msg.type === "reply_end") {
    liveAgent = null;
  } else if (msg.type === "latency") {
    $("latency").textContent = `提交 → 首个音频: ${msg.ms} ms`;
    addLog("ctl", "", "latency", `提交 → 首个音频 ${msg.ms} ms`);
  } else if (msg.type === "pause") {
    paused = true; playCtx.suspend(); addLog("ctl", "", "pause", "用户开口,暂停播放");
  } else if (msg.type === "resume") {
    paused = false; playCtx.resume(); addLog("ctl", "", "resume", "不是打断,恢复播放");
  } else if (msg.type === "clear") {
    paused = false; clearPlayback(); addLog("ctl", "", "clear", "确认打断,停止播放");
    lastAgent?.classList.add("cut"); liveAgent = lastAgent = null;
  } else if (msg.type === "error") {
    addLog("error", "", "error", msg.message);
  }
  setStatus();
}

// ---- 启动 / 停止 ----
async function listMics() {
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audioinput");
  const current = $("mic").value;
  $("mic").replaceChildren(...devices.map((d, i) => new Option(d.label || `麦克风 ${i + 1}`, d.deviceId)));
  if (devices.some((d) => d.deviceId === current)) $("mic").value = current;
}

async function start() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      deviceId: $("mic").value ? { exact: $("mic").value } : undefined,
      echoCancellation: $("aec").checked, noiseSuppression: $("ns").checked,
      autoGainControl: true, channelCount: 1,
    },
  });
  await listMics();  // 授权后才能拿到设备名
  $("mic").value = micStream.getAudioTracks()[0].getSettings().deviceId || $("mic").value;

  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onmessage = (e) => (typeof e.data === "string" ? onMessage(JSON.parse(e.data)) : playPcm(e.data));
  ws.onclose = () => { if (running) stop(); };
  await new Promise((resolve, reject) => { ws.onopen = resolve; ws.onerror = reject; });

  playCtx = new AudioContext();
  micCtx = new AudioContext({ sampleRate: 16000 });  // 浏览器负责把麦克风重采样到 16kHz
  await micCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
  const capture = new AudioWorkletNode(micCtx, "capture");
  capture.port.onmessage = (e) => { if (ws.readyState === 1) ws.send(e.data); };
  micCtx.createMediaStreamSource(micStream).connect(capture);

  running = true; $("toggle").textContent = "停止"; setStatus();
}

function stop() {
  running = false; paused = false; userSpeaking = false; playing = false;
  micStream?.getTracks().forEach((t) => t.stop());
  micCtx?.close(); playCtx?.close(); ws?.close();
  sources.clear(); nextPlayTime = 0; liveUser = liveAgent = lastAgent = null;
  $("toggle").textContent = "开始"; setStatus();
}

async function restart() { if (running) { stop(); await start(); } }

$("toggle").onclick = () => (running ? stop() : start().catch((e) => { addLog("error", "", "error", String(e)); stop(); }));
$("mic").onchange = $("aec").onchange = $("ns").onchange = restart;
navigator.mediaDevices.addEventListener("devicechange", listMics);
listMics();
</script>
</body>
</html>
